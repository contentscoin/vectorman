# Netlify deployment for the static export.
#
# The headers here are not decorative: `scripts/verify-web.mjs` parses this file and
# serves them in front of the exported artifact, so the whole browser suite runs
# against this exact policy. A Content-Security-Policy that broke the Web Worker or
# the object URLs used for previews and downloads would fail those tests rather than
# reaching production.

[build]
  base = "."
  # --ignore-scripts is required, not cosmetic: without it pnpm exits non-zero over an
  # unapproved build script belonging to a dependency this app never uses. See the
  # comment in pnpm-workspace.yaml.
  command = "corepack enable && pnpm install --frozen-lockfile --ignore-scripts && pnpm run build:static"
  publish = "apps/web/out"

[build.environment]
  NODE_VERSION = "24"
  CI = "true"

# Applied to everything, then narrowed by the more specific blocks below.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The app never uses these, and saying so limits the damage of a future mistake.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Conversion happens entirely in the browser, so the policy can be tight about
    # where code and data may come from.
    #
    # 'unsafe-inline' in script-src is unavoidable: a static export has no server to
    # mint a per-request nonce, and Next.js emits inline bootstrap scripts. Removing
    # it produces a blank page. Everything else is locked down, and object-src 'none'
    # plus base-uri 'self' close the paths that matter most without one.
    #
    # blob: is needed in img-src and connect-src because uploads are read through
    # object URLs and results are handed to the user the same way.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

# Filenames are content-hashed, so these can be cached permanently. Without this the
# 64KB engine chunk is refetched on every visit.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/samples/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# HTML must not be cached, or a deploy leaves visitors pinned to the previous build's
# asset references.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/studio/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
